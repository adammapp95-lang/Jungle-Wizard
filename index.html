<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jungle Wizard - Aethelgard Campaign</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #09090b;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 960px;
            max-height: 540px;
            background: #18181b;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #111827;
        }
        #hud {
            position: absolute;
            top: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .hud-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .badge {
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #pause-btn {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #touch-controls {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 10;
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .t-btn {
            width: 64px;
            height: 64px;
            background: rgba(30, 41, 59, 0.7);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            transition: transform 0.05s, background 0.05s;
        }
        .t-btn:active, .t-btn.pressed {
            background: rgba(59, 130, 246, 0.8);
            transform: scale(0.92);
        }
        #fire-btn {
            background: rgba(220, 38, 38, 0.75);
            border-color: rgba(250, 204, 21, 0.6);
            display: none;
        }
        #fire-btn:active, #fire-btn.pressed {
            background: rgba(239, 68, 68, 0.9);
        }
        /* Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 9, 11, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
            padding: 24px;
        }
        .overlay h1 {
            font-size: 3rem;
            margin: 0 0 8px 0;
            background: linear-gradient(to bottom, #f87171, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            letter-spacing: 2px;
        }
        .overlay p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 500px;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        .btn-primary {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.5);
            transition: transform 0.1s, filter 0.1s;
            margin-bottom: 12px;
        }
        .btn-primary:active {
            transform: scale(0.96);
            filter: brightness(0.9);
        }
        .btn-secondary {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            backdrop-filter: blur(4px);
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-group">
            <div class="badge" id="hud-level">Level 1</div>
            <div class="badge" id="hud-hp">❤️❤️❤️❤️❤️</div>
        </div>
        <div class="hud-group">
            <div class="badge" id="hud-gems">💎 0</div>
            <button id="pause-btn" title="Pause">II</button>
        </div>
    </div>

    <!-- Touch Controls -->
    <div id="touch-controls" class="hidden">
        <div class="touch-group">
            <div class="t-btn" id="btn-left">◀</div>
            <div class="t-btn" id="btn-right">▶</div>
        </div>
        <div class="touch-group">
            <div class="t-btn" id="fire-btn">🔥</div>
            <div class="t-btn" id="btn-jump">▲</div>
        </div>
    </div>

    <!-- Start / Title Overlay -->
    <div id="title-overlay" class="overlay">
        <h1>JUNGLE WIZARD</h1>
        <p>Aethelgard Campaign • Defeat the jungle beasts, navigate crumbling ruins, and rescue Princess Nova.</p>
        <button class="btn-primary" id="start-btn">ENTER THE JUNGLE</button>
        <button class="btn-secondary hidden" id="continue-btn">CONTINUE LEVEL 1</button>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <p>Take a breather, brave wizard.</p>
        <button class="btn-primary" id="resume-btn">RESUME</button>
        <button class="btn-secondary" id="restart-lvl-btn">RESTART LEVEL</button>
        <button class="btn-secondary" id="quit-btn">SAVE & QUIT TO TITLE</button>
    </div>

    <!-- Game Over / Retry Overlay -->
    <div id="gameover-overlay" class="overlay hidden">
        <h1 id="gameover-title">DEFEATED</h1>
        <p id="gameover-desc">The perilous jungle got the better of you.</p>
        <button class="btn-primary" id="retry-btn">RETRY LEVEL</button>
        <button class="btn-secondary" id="menu-btn">QUIT TO TITLE</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Audio Context & Sound Helper
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.08); // A5
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'fire') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        } catch (e) {
            // Audio blocked/unsupported safety fallback
        }
    }

    // Game States: 'TITLE', 'ESTABLISHING_SHOT', 'INTRO', 'PLAYING', 'PAUSED', 'GAMEOVER'
    let gameState = 'TITLE';
    let currentLevel = 1;
    let score = 0;
    let gemsCollected = 0;

    // Intro / Cutscene Data
    let introStep = 0;
    let introTimer = 0;
    const introDialogue = [
        { speaker: "King Norman II", text: "Ah, Orion! Thank the stars you have answered my call. Evil forces have breached our borders and kidnapped my daughter, Princess Nova, dragging her deep into the perilous Veridian Abyss!" },
        { speaker: "King Norman II", text: "I dispatched my finest champion, Sir Moosimus, into the canopy days ago to track them, but he has vanished without a trace. Keep a sharp eye out for him—I pray he still draws breath." },
        { speaker: "Orion", text: "Fear not, Your Majesty. No goblin horde, flying beast, or missing knight named Sir Moosimus shall stop me. I will bring the Princess home." },
        { speaker: "King Norman II", text: "Brave wizard... Should you succeed, the kingdom of Aethelgard and its throne will be forever in your debt. May the ancient magic guide your steps!" }
    ];

    // Establishing Shot Timer
    let establishingTimer = 0;

    // Input state
    const keys = { left: false, right: false, jump: false, fire: false };

    // Player object
    let player = {
        x: 60, y: 350, w: 28, h: 36,
        vx: 0, vy: 0,
        speed: 3.6, jumpForce: -10.5,
        grounded: false,
        hp: 5, maxHp: 5,
        facing: 1, // 1 right, -1 left
        invincible: 0,
        dead: false,
        deathTimer: 0
    };

    // Camera
    let camera = { x: 0, y: 0 };

    // Level data arrays
    let platforms = [];
    let hazards = [];
    let collectibles = [];
    let enemies = [];
    let projectils = [];
    let particles = [];
    let levelWidth = 3200;

    // Load progress from localStorage
    function loadProgress() {
        const savedLevel = localStorage.getItem('jungle_wizard_level');
        const savedGems = localStorage.getItem('jungle_wizard_gems');
        if (savedLevel) {
            currentLevel = parseInt(savedLevel, 10);
            gemsCollected = savedGems ? parseInt(savedGems, 10) : 0;
            const contBtn = document.getElementById('continue-btn');
            contBtn.textContent = `CONTINUE LEVEL ${currentLevel}`;
            contBtn.classList.remove('hidden');
        }
    }

    function saveProgress() {
        localStorage.setItem('jungle_wizard_level', currentLevel);
        localStorage.setItem('jungle_wizard_gems', gemsCollected);
    }

    // Initialize Level Layout
    function initLevel(lvl) {
        currentLevel = lvl;
        platforms = [];
        hazards = [];
        collectibles = [];
        enemies = [];
        projectils = [];
        particles = [];

        player.x = 60;
        player.y = 350;
        player.vx = 0;
        player.vy = 0;
        player.hp = (lvl === 4) ? 1 : 5;
        player.maxHp = (lvl === 4) ? 1 : 5;
        player.dead = false;
        player.deathTimer = 0;

        if (lvl === 1) levelWidth = 3000;
        else if (lvl === 2) levelWidth = 3600;
        else if (lvl === 3) levelWidth = 4200;
        else levelWidth = 4800;

        // Ground blocks & chasms
        let curX = 0;
        while (curX < levelWidth) {
            let width = 600 + Math.random() * 400;
            if (lvl >= 2 && curX > 800 && Math.random() < 0.35) {
                // Chasm with crumbling bridge or moving platform
                curX += 300; // gap
            } else {
                platforms.push({ x: curX, y: 460, w: width, h: 80, type: 'ground' });
                
                // Add spikes safely on ground
                if (curX > 400 && Math.random() < 0.4) {
                    hazards.push({ x: curX + 100, y: 440, w: 40, h: 20, type: 'spike' });
                }
                // Add gems & collectibles
                if (curX > 300) {
                    collectibles.push({ x: curX + 150, y: 400, type: 'ruby', collected: false });
                    collectibles.push({ x: curX + 250, y: 400, type: 'emerald', collected: false });
                }
                curX += width;
            }
        }

        // Ensure safe start platform
        platforms.unshift({ x: 0, y: 460, w: 700, h: 80, type: 'ground' });
        // Exit portal at the end
        platforms.push({ x: levelWidth - 200, y: 360, w: 40, h: 100, type: 'portal' });

        // Add elevated platforms & moving platforms
        for (let i = 900; i < levelWidth - 400; i += 350) {
            let py = 280 + (Math.sin(i) * 60);
            let isMoving = (lvl >= 2 && i % 700 === 0);
            platforms.push({
                x: i, y: py, w: 140, h: 20,
                type: isMoving ? 'moving' : 'platform',
                startX: i, range: 120, speed: 1.5, dir: 1
            });

            // Add healing flower or gems on platforms
            if (Math.random() < 0.5) {
                collectibles.push({ x: i + 50, y: py - 35, type: Math.random() < 0.2 ? 'heart' : 'sapphire', collected: false });
            }
        }

        // Add Enemies (Goblins & Pterodactyls)
        for (let i = 1200; i < levelWidth - 400; i += 500) {
            let isFlyer = (lvl >= 3 && i % 1000 === 0);
            enemies.push({
                x: i, y: isFlyer ? 180 : 420, w: 32, h: 32,
                vx: isFlyer ? 1.5 : 1,
                range: 180, startX: i,
                type: isFlyer ? 'pterodactyl' : 'goblin',
                alive: true, shootCooldown: 0
            });
        }
    }

    // Input Event Listeners
    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
            if (!keys.jump && gameState === 'PLAYING') playerJump();
            keys.jump = true;
        }
        if (e.code === 'KeyF' || e.code === 'KeyX') {
            if (currentLevel >= 3 && gameState === 'PLAYING') fireSpell();
        }
        if (e.code === 'KeyP' || e.code === 'Escape') {
            if (gameState === 'PLAYING') togglePause();
            else if (gameState === 'PAUSED') resumeGame();
        }
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = false;
    });

    // Touch Controls Wiring
    function setupTouchButton(id, keyName, callback) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            initAudio();
            keys[keyName] = true;
            btn.classList.add('pressed');
            if (callback) callback();
        });
        btn.addEventListener('touchend', e => {
            e.preventDefault();
            keys[keyName] = false;
            btn.classList.remove('pressed');
        });
        btn.addEventListener('mousedown', e => {
            initAudio();
            keys[keyName] = true;
            btn.classList.add('pressed');
            if (callback) callback();
        });
        btn.addEventListener('mouseup', e => {
            keys[keyName] = false;
            btn.classList.remove('pressed');
        });
    }

    setupTouchButton('btn-left', 'left');
    setupTouchButton('btn-right', 'right');
    setupTouchButton('btn-jump', 'jump', () => { if (gameState === 'PLAYING') playerJump(); });
    setupTouchButton('fire-btn', 'fire', () => { if (currentLevel >= 3 && gameState === 'PLAYING') fireSpell(); });

    document.getElementById('pause-btn').addEventListener('click', () => { if (gameState === 'PLAYING') togglePause(); });

    // Overlay Buttons
    document.getElementById('start-btn').addEventListener('click', () => {
        initAudio();
        document.getElementById('title-overlay').classList.add('hidden');
        // Start with establishing shot of Aethelgard
        establishingTimer = 0;
        gameState = 'ESTABLISHING_SHOT';
    });

    document.getElementById('continue-btn').addEventListener('click', () => {
        initAudio();
        document.getElementById('title-overlay').classList.add('hidden');
        initLevel(currentLevel);
        startGameplayUI();
    });

    document.getElementById('resume-btn').addEventListener('click', resumeGame);
    document.getElementById('restart-lvl-btn').addEventListener('click', () => {
        document.getElementById('pause-overlay').classList.add('hidden');
        initLevel(currentLevel);
        startGameplayUI();
    });
    document.getElementById('quit-btn').addEventListener('click', quitToTitle);

    document.getElementById('retry-btn').addEventListener('click', () => {
        document.getElementById('gameover-overlay').classList.add('hidden');
        initLevel(currentLevel);
        startGameplayUI();
    });
    document.getElementById('menu-btn').addEventListener('click', quitToTitle);

    // Click/Tap anywhere during cutscenes to advance
    window.addEventListener('pointerdown', () => {
        if (gameState === 'ESTABLISHING_SHOT') {
            // Skip straight to throne room intro
            introStep = 0;
            introTimer = 0;
            gameState = 'INTRO';
        } else if (gameState === 'INTRO') {
            introStep++;
            introTimer = 0;
            if (introStep >= introDialogue.length) {
                initLevel(1);
                startGameplayUI();
            }
        }
    });

    function startGameplayUI() {
        gameState = 'PLAYING';
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('touch-controls').classList.remove('hidden');
        if (currentLevel >= 3) {
            document.getElementById('fire-btn').style.display = 'flex';
        } else {
            document.getElementById('fire-btn').style.display = 'none';
        }
    }

    function togglePause() {
        gameState = 'PAUSED';
        document.getElementById('pause-overlay').classList.remove('hidden');
    }

    function resumeGame() {
        document.getElementById('pause-overlay').classList.add('hidden');
        gameState = 'PLAYING';
    }

    function quitToTitle() {
        document.getElementById('pause-overlay').classList.add('hidden');
        document.getElementById('gameover-overlay').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('touch-controls').classList.add('hidden');
        gameState = 'TITLE';
        loadProgress();
        document.getElementById('title-overlay').classList.remove('hidden');
    }

    function playerJump() {
        if (player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
            playSound('jump');
            createParticles(player.x + player.w/2, player.y + player.h, '#94a3b8', 6);
        }
    }

    function fireSpell() {
        playSound('fire');
        projectils.push({
            x: player.x + (player.facing > 0 ? player.w : -16),
            y: player.y + player.h / 2 - 6,
            vx: player.facing * 9,
            vy: 0,
            w: 16, h: 10,
            fromPlayer: true
        });
    }

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 30, color: color
            });
        }
    }

    // Main Game Loop
    function update() {
        if (gameState !== 'PLAYING') return;

        if (player.dead) {
            player.deathTimer--;
            if (player.deathTimer <= 0) {
                // Respawn at current level start with 1 HP or restart level
                player.dead = false;
                player.x = 60;
                player.y = 350;
                player.vx = 0;
                player.vy = 0;
                player.hp = (currentLevel === 4) ? 1 : 3;
            }
            return;
        }

        // Horizontal movement
        player.vx = 0;
        if (keys.left) {
            player.vx = -player.speed;
            player.facing = -1;
        }
        if (keys.right) {
            player.vx = player.speed;
            player.facing = 1;
        }

        // Gravity
        player.vy += 0.45;
        if (player.vy > 12) player.vy = 12;

        player.x += player.vx;
        // Collision X
        platforms.forEach(p => {
            if (p.type !== 'portal' && rectIntersect(player, p)) {
                if (player.vx > 0) player.x = p.x - player.w;
                else if (player.vx < 0) player.x = p.x + p.w;
            }
        });

        player.y += player.vy;
        player.grounded = false;
        // Collision Y
        platforms.forEach(p => {
            if (p.type !== 'portal' && rectIntersect(player, p)) {
                if (player.vy > 0) { // Landing
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                    if (p.type === 'moving') {
                        p.x += p.speed * p.dir;
                        if (p.x < p.startX || p.x > p.startX + p.range) p.dir *= -1;
                        player.x += p.speed * p.dir;
                    }
                } else if (player.vy < 0) { // Head bump
                    player.y = p.y + p.h;
                    player.vy = 0;
                }
            }
            // Portal Check
            if (p.type === 'portal' && rectIntersect(player, p)) {
                if (currentLevel < 4) {
                    currentLevel++;
                    saveProgress();
                    initLevel(currentLevel);
                } else {
                    // Victory!
                    gameState = 'TITLE';
                    document.getElementById('hud').classList.add('hidden');
                    document.getElementById('touch-controls').classList.add('hidden');
                    alert("CONGRATULATIONS! You rescued Princess Nova and saved the Kingdom of Aethelgard!");
                    loadProgress();
                    document.getElementById('title-overlay').classList.remove('hidden');
                }
            }
        });

        // Pit fall check (deduct 1 HP and respawn at level start)
        if (player.y > 540) {
            player.hp -= 1;
            playSound('hit');
            if (player.hp <= 0) {
                triggerDeath();
            } else {
                player.x = 60;
                player.y = 200;
                player.vx = 0;
                player.vy = 0;
            }
        }

        // Invulnerability timer
        if (player.invincible > 0) player.invincible--;

        // Hazards Collision (Spikes)
        hazards.forEach(h => {
            if (rectIntersect(player, h) && player.invincible === 0) {
                player.hp--;
                player.invincible = 45;
                playSound('hit');
                createParticles(player.x + player.w/2, player.y + player.h/2, '#ef4444', 8);
                if (player.hp <= 0) triggerDeath();
            }
        });

        // Collectibles
        collectibles.forEach(c => {
            if (!c.collected && Math.abs(player.x + player.w/2 - c.x) < 24 && Math.abs(player.y + player.h/2 - c.y) < 24) {
                c.collected = true;
                if (c.type === 'heart') {
                    player.hp = Math.min(player.maxHp, player.hp + 1);
                    playSound('heal');
                } else {
                    score += (c.type === 'ruby' ? 100 : c.type === 'emerald' ? 250 : 500);
                    gemsCollected++;
                    playSound('coin');
                }
            }
        });

        // Enemies update & AI
        enemies.forEach(e => {
            if (!e.alive) return;
            e.x += e.vx;
            if (e.x < e.startX - e.range || e.x > e.startX + e.range) e.vx *= -1;

            // Pterodactyl venom shooting when facing wizard
            if (e.type === 'pterodactyl') {
                let dx = player.x - e.x;
                if ((e.vx > 0 && dx > 0) || (e.vx < 0 && dx < 0)) {
                    e.shootCooldown++;
                    if (e.shootCooldown > 90) {
                        e.shootCooldown = 0;
                        projectils.push({
                            x: e.x + 12, y: e.y + 16,
                            vx: e.vx > 0 ? 4 : -4, vy: 0,
                            w: 12, h: 8, fromPlayer: false
                        });
                    }
                }
            }

            // Player contact damage
            if (rectIntersect(player, e) && player.invincible === 0) {
                player.hp--;
                player.invincible = 45;
                playSound('hit');
                if (player.hp <= 0) triggerDeath();
            }
        });

        // Projectiles update
        projectils.forEach((pr, idx) => {
            pr.x += pr.vx;
            pr.y += pr.vy;

            // Player projectile hits enemy
            if (pr.fromPlayer) {
                enemies.forEach(e => {
                    if (e.alive && rectIntersect(pr, e)) {
                        e.alive = false;
                        pr.toDelete = true;
                        score += 300;
                        createParticles(e.x, e.y, '#f59e0b', 10);
                    }
                });
            } else {
                // Enemy projectile hits player
                if (rectIntersect(pr, player) && player.invincible === 0) {
                    player.hp--;
                    player.invincible = 45;
                    pr.toDelete = true;
                    playSound('hit');
                    if (player.hp <= 0) triggerDeath();
                }
            }
        });
        projectils = projectils.filter(pr => !pr.toDelete && pr.x > camera.x - 100 && pr.x < camera.x + 1060);

        // Particles update
        particles.forEach(pt => {
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.life--;
        });
        particles = particles.filter(pt => pt.life > 0);

        // Camera follow player smoothly
        let targetCamX = player.x - 300;
        if (targetCamX < 0) targetCamX = 0;
        if (targetCamX > levelWidth - 960) targetCamX = levelWidth - 960;
        camera.x += (targetCamX - camera.x) * 0.1;

        // Update HUD display
        document.getElementById('hud-level').textContent = `Level ${currentLevel}`;
        document.getElementById('hud-hp').textContent = '❤️'.repeat(Math.max(0, player.hp));
        document.getElementById('hud-gems').textContent = `💎 ${gemsCollected}`;
    }

    function triggerDeath() {
        player.dead = true;
        player.deathTimer = 90;
        playSound('hit');
        createParticles(player.x, player.y, '#dc2626', 20);
        
        // Show Game Over / Retry Screen
        document.getElementById('gameover-title').textContent = `DEFEATED IN LEVEL ${currentLevel}`;
        document.getElementById('gameover-desc').textContent = "The perils of the Veridian Abyss proved too fierce. Regroup and try again!";
        document.getElementById('gameover-overlay').classList.remove('hidden');
        gameState = 'GAMEOVER';
    }

    function rectIntersect(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
               r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    // Render / Drawing
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'ESTABLISHING_SHOT') {
            drawEstablishingShot();
            return;
        }
        if (gameState === 'INTRO') {
            drawThroneRoomIntro();
            return;
        }

        ctx.save();
        ctx.translate(-camera.x, 0);

        // Sky & Parallax Background Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, 540);
        if (currentLevel === 4) {
            skyGrad.addColorStop(0, '#2e1065');
            skyGrad.addColorStop(1, '#0f172a');
        } else {
            skyGrad.addColorStop(0, '#1e1b4b');
            skyGrad.addColorStop(0.6, '#312e81');
            skyGrad.addColorStop(1, '#065f46');
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(camera.x, 0, 960, 540);

        // Draw distant mountains parallax
        ctx.fillStyle = '#064e3b';
        ctx.beginPath();
        ctx.moveTo(camera.x, 380);
        for (let x = camera.x; x < camera.x + 960; x += 120) {
            ctx.lineTo(x, 320 + Math.sin(x * 0.003) * 60);
        }
        ctx.lineTo(camera.x + 960, 540);
        ctx.lineTo(camera.x, 540);
        ctx.fill();

        // Platforms
        platforms.forEach(p => {
            if (p.type === 'ground') {
                ctx.fillStyle = '#064e3b';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Stone brick top trim
                ctx.fillStyle = '#047857';
                ctx.fillRect(p.x, p.y, p.w, 14);
            } else if (p.type === 'moving') {
                ctx.fillStyle = '#34d399';
                ctx.fillRect(p.x, p.y, p.w, p.h);
            } else if (p.type === 'portal') {
                ctx.fillStyle = '#ec4899';
                ctx.shadowColor = '#f472b6';
                ctx.shadowBlur = 15;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#059669';
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }
        });

        // Hazards (Strictly Grounded Crystal Spikes)
        hazards.forEach(h => {
            ctx.fillStyle = '#db2777';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(h.x, h.y + h.h);
            ctx.lineTo(h.x + h.w / 2, h.y);
            ctx.lineTo(h.x + h.w, h.y + h.h);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // Collectibles
        collectibles.forEach(c => {
            if (c.collected) return;
            ctx.save();
            ctx.translate(c.x, c.y);
            if (c.type === 'ruby') {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
            } else if (c.type === 'emerald') {
                ctx.fillStyle = '#10b981';
                ctx.fillRect(-6, -6, 12, 12);
            } else if (c.type === 'sapphire') {
                ctx.fillStyle = '#3b82f6';
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
            } else if (c.type === 'heart') {
                ctx.fillStyle = '#f43f5e';
                ctx.font = '16px sans-serif';
                ctx.fillText('❤️', -8, 6);
            }
            ctx.restore();
        });

        // Enemies
        enemies.forEach(e => {
            if (!e.alive) return;
            ctx.save();
            if (e.type === 'goblin') {
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Eyes
                ctx.fillStyle = '#facc15';
                ctx.fillRect(e.x + (e.vx > 0 ? 20 : 4), e.y + 8, 6, 6);
            } else {
                // Pterodactyl
                ctx.fillStyle = '#7c2d12';
                ctx.beginPath();
                ctx.ellipse(e.x + 16, e.y + 16, 16, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                // Wings
                ctx.fillStyle = '#9a3412';
                ctx.fillRect(e.x + 4, e.y + (Math.sin(Date.now() * 0.02) > 0 ? 0 : 16), 24, 6);
            }
            ctx.restore();
        });

        // Projectiles
        projectils.forEach(pr => {
            ctx.fillStyle = pr.fromPlayer ? '#fbbf24' : '#22c55e';
            ctx.shadowColor = pr.fromPlayer ? '#f59e0b' : '#10b981';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(pr.x, pr.y + pr.h/2, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // Particles
        particles.forEach(pt => {
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, 4, 4);
        });

        // Player (Red & Black Wizard)
        if (!player.dead && (player.invincible % 4 < 2)) {
            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
            if (player.facing < 1) ctx.scale(-1, 1);

            // Robes
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(-10, -8, 20, 26);
            // Hood
            ctx.fillStyle = '#18181b';
            ctx.beginPath();
            ctx.arc(0, -10, 10, Math.PI, 0, false);
            ctx.fill();
            // Glowing Wizard Eyes
            ctx.fillStyle = '#facc15';
            ctx.fillRect(2, -12, 3, 3);

            ctx.restore();
        }

        ctx.restore();
    }

    // Establishing Wide Shot Renderer
    function drawEstablishingShot() {
        // Twilight Sky
        let grad = ctx.createLinearGradient(0, 0, 0, 540);
        grad.addColorStop(0, '#312e81');
        grad.addColorStop(0.5, '#7c2d12');
        grad.addColorStop(1, '#b45309');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 960, 540);

        // Distant Mountains
        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.moveTo(0, 360);
        ctx.lineTo(200, 240);
        ctx.lineTo(450, 320);
        ctx.lineTo(700, 220);
        ctx.lineTo(960, 300);
        ctx.lineTo(960, 540);
        ctx.lineTo(0, 540);
        ctx.fill();

        // The Veridian Abyss Jungle canopy on the right
        ctx.fillStyle = '#064e3b';
        ctx.beginPath();
        ctx.moveTo(500, 540);
        ctx.quadraticCurveTo(700, 300, 960, 350);
        ctx.lineTo(960, 540);
        ctx.fill();

        // Kingdom of Aethelgard (White marble spires with golden trims on left)
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(100, 220, 80, 220);
        ctx.fillRect(60, 280, 60, 160);
        ctx.fillRect(200, 260, 70, 180);

        // Golden Trim & Spires
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(100, 220);
        ctx.lineTo(140, 140);
        ctx.lineTo(180, 220);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(60, 280);
        ctx.lineTo(90, 220);
        ctx.lineTo(120, 280);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(200, 260);
        ctx.lineTo(235, 180);
        ctx.lineTo(270, 260);
        ctx.fill();

        // Banner text overlay
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 440, 960, 100);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText("The Kingdom of Aethelgard — Bordering the Veridian Abyss", 480, 480);
        ctx.font = '16px system-ui';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText("Tap anywhere to begin the audience with King Norman II...", 480, 510);
    }

    // Throne Room Intro Renderer
    function drawThroneRoomIntro() {
        // Throne Room Background
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(0, 0, 960, 540);
        // Stone pillars
        ctx.fillStyle = '#292524';
        ctx.fillRect(80, 0, 120, 540);
        ctx.fillRect(760, 0, 120, 540);

        // Draw King Norman II Portrait on Left
        ctx.save();
        ctx.translate(100, 120);
        ctx.fillStyle = '#f59e0b'; // Crown
        ctx.fillRect(20, 10, 80, 25);
        ctx.fillStyle = '#b45309'; // Robes
        ctx.fillRect(10, 100, 100, 160);
        ctx.fillStyle = '#d1d5db'; // Beard / Face
        ctx.fillRect(30, 45, 60, 55);
        ctx.restore();

        // Draw Orion Portrait on Right
        ctx.save();
        ctx.translate(720, 120);
        ctx.fillStyle = '#991b1b'; // Red Wizard Robes
        ctx.fillRect(10, 100, 100, 160);
        ctx.fillStyle = '#18181b'; // Hood
        ctx.beginPath();
        ctx.arc(60, 55, 35, Math.PI, 0, false);
        ctx.fill();
        ctx.fillStyle = '#facc15'; // Glowing Eyes
        ctx.fillRect(50, 50, 6, 6);
        ctx.fillRect(68, 50, 6, 6);
        ctx.restore();

        // Dialogue Box at Bottom
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        ctx.fillRect(40, 360, 880, 150);
        ctx.strokeRect(40, 360, 880, 150);

        let currentLine = introDialogue[Math.min(introStep, introDialogue.length - 1)];
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 20px system-ui';
        ctx.textAlign = 'left';
        ctx.fillText(currentLine.speaker, 70, 400);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '18px system-ui';
        
        // Wrap text neatly
        let words = currentLine.text.split(' ');
        let line = '';
        let lineY = 435;
        for (let i = 0; i < words.length; i++) {
            let testLine = line + words[i] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > 820 && i > 0) {
                ctx.fillText(line, 70, lineY);
                line = words[i] + ' ';
                lineY += 26;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, 70, lineY);

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'italic 14px system-ui';
        ctx.textAlign = 'right';
        ctx.fillText("Tap anywhere to continue ▶", 890, 495);
    }

    // Loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Initialize state on load
    loadProgress();
    requestAnimationFrame(loop);
</script>
